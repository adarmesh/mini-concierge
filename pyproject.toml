[project]
name = "mini-concierge"
version = "0.1.0"
description = ""
authors = [{ name = "Aidar Darmesh", email = "darmesh.aidar@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph (==0.2.76)",
    "langfuse (==2.60.9)",
    "langchain-core (==0.3.75)",
    "langchain-openai (==0.3.32)",
    "deepeval (==3.7.7)",
    "langchain-community (==0.3.29)",
    "ddgs (>=9.16.1,<10.0.0)",
    "pygraphviz (>=2.0.4,<3.0.0)",
    "langgraph-checkpoint-sqlite (>=2.0.11,<3.0.0)",
    "google-search-results (>=2.4.2,<3.0.0)",
    "aiosqlite (==0.20.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
python-dotenv = "^1.2.4"
